name: iOS Tests
on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'

# Single source of truth for the simulator OS, so the job that builds and the
# job that creates simulators to run on can never drift apart.
env:
  IOS_OS: "26.2"
  IOS_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-26-2"

jobs:
  build:
    name: Build for Testing
    runs-on: macos-15
    # Resolving Swift package dependencies (AWS SDK et al.) can be slow on
    # fresh runners, so give the build a full hour.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Get available runtime
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep iOS | tail -1 | awk '{print $NF}')
          echo "Available runtime: $RUNTIME"
          xcrun simctl list devices available | grep iPhone

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: "ios/Positive Only Social/build/SourcePackages"
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Positive Only Social/Positive Only Social.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Package Dependencies
        working-directory: "ios/Positive Only Social"
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Positive Only Social.xcodeproj" \
            -scheme "Positive Only Social" \
            -derivedDataPath build \
          | xcpretty
          exit ${PIPESTATUS[0]}

      - name: Build for Testing
        working-directory: "ios/Positive Only Social"
        run: |
          xcodebuild build-for-testing \
            -project "Positive Only Social.xcodeproj" \
            -scheme "Positive Only Social" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=$IOS_OS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
          | tee build.log | xcpretty
          exit ${PIPESTATUS[0]}

      - name: Show build failures
        if: failure()
        working-directory: "ios/Positive Only Social"
        run: |
          echo "=== Compiler errors ==="
          grep -E "error:" build.log | grep -v "^▸" | head -50 || echo "(none)"
          echo ""
          echo "=== Last 150 lines of raw log ==="
          tail -500 build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "ios/Positive Only Social/build.log"

      - name: Upload Test Bundle
        uses: actions/upload-artifact@v4
        with:
          name: test-bundle
          path: "ios/Positive Only Social/build/Build/Products/"

  test:
    name: Test (${{ matrix.test-group }})
    needs: build
    runs-on: macos-15
    # Without this the job inherits the 360-minute default; a job cancelled at
    # that limit skips the if: failure() steps, so we'd get no logs at all.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        test-group: [Unit_Tests, UI_Tests_Alpha, UI_Tests_Beta, UI_Tests_Gamma, UI_Tests_Delta, UI_Tests_Epsilon]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Boot Simulators
        run: |
          # Two independent simulators so a group's tests can run in two shards
          # in parallel on the same runner (issue #377). We keep the fixed macOS
          # runner count and instead use both simulator slots each runner has.
          #
          # Pin the same runtime the build job builds against (IOS_RUNTIME /
          # IOS_OS below) rather than "newest installed": simctl lists
          # unavailable runtimes too, and picking the newest would silently test
          # on a different OS than we built for whenever the image bumps Xcode.
          # -F: the identifier contains dots, which would otherwise be regex
          # wildcards and could match a runtime that isn't the one we want.
          if ! xcrun simctl list runtimes available | grep -qF -- "$IOS_RUNTIME"; then
            echo "Runtime $IOS_RUNTIME is not available on this runner. Available:"
            xcrun simctl list runtimes available
            exit 1
          fi
          SIM_A=$(xcrun simctl create "PosTest-A" "iPhone 16" "$IOS_RUNTIME")
          SIM_B=$(xcrun simctl create "PosTest-B" "iPhone 16" "$IOS_RUNTIME")
          echo "SIM_A=$SIM_A" >> "$GITHUB_ENV"
          echo "SIM_B=$SIM_B" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_A"
          xcrun simctl boot "$SIM_B"
          xcrun simctl bootstatus "$SIM_A" -b
          xcrun simctl bootstatus "$SIM_B" -b

      - name: Download Test Bundle
        uses: actions/download-artifact@v4
        with:
          name: test-bundle
          path: "ios/Positive Only Social/build/Build/Products"

      - name: List available test bundles
        working-directory: "ios/Positive Only Social"
        run: |
          echo "=== xctestrun files ==="
          find build/Build/Products -name "*.xctestrun"

      - name: Run Tests
        timeout-minutes: 60
        shell: bash
        run: |
            cd "ios/Positive Only Social"
            rm -rf TestResults-A.xcresult TestResults-B.xcresult xcodebuild-A.log xcodebuild-B.log
            case "${{ matrix.test-group }}" in
              Unit_Tests)
                TESTS=(
                  "Positive Only SocialTests"
                )
                # "Positive Only Social Unit Tests" plan covers unit tests only
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep "Unit Tests" | head -1)
                ;;
              UI_Tests_Alpha)
                TESTS=(
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testAutomaticLoginAfterRememberMe"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testDeleteAccount"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testResetPassword"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testTappingOutsideFieldDismissesKeyboard"
                )
                # "Positive Only Social" (default) plan covers both unit and UI tests
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep -v "Unit Tests" | head -1)
                ;;
              UI_Tests_Beta)
                TESTS=(
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testFollowAndUnfollowFromSearch"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testFollowAndUnfollowFromPost"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testLikeAndUnlikePost"
                )
                # "Positive Only Social" (default) plan covers both unit and UI tests
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep -v "Unit Tests" | head -1)
                ;;
              UI_Tests_Gamma)
                TESTS=(
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testVerifyIdentity"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testLikeAndUnlikeCommentOnPostAndThread"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testReportPost"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testDeleteOwnPost"
                )
                # "Positive Only Social" (default) plan covers both unit and UI tests
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep -v "Unit Tests" | head -1)
                ;;
              UI_Tests_Delta)
                TESTS=(
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testReportComment"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testDeleteOwnComment"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testLaunchPerformance"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testBlockAndUnblockUser"
                )
                # "Positive Only Social" (default) plan covers both unit and UI tests
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep -v "Unit Tests" | head -1)
                ;;
              UI_Tests_Epsilon)
                TESTS=(
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testOpenPostDetailFromHomeGrid"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testOpenPostDetailFromProfileGrid"
                  "Positive Only SocialUITests/Positive_Only_SocialUITests/testOpenPostDetailFromFollowingFeed"
                )
                # "Positive Only Social" (default) plan covers both unit and UI tests
                XCTESTRUN=$(find build/Build/Products -name "*.xctestrun" | grep -v "Unit Tests" | head -1)
                ;;
            esac

            # Fallback: if the pattern found nothing, take the first available file
            XCTESTRUN=${XCTESTRUN:-$(find build/Build/Products -name "*.xctestrun" | head -1)}
            echo "Using xctestrun: $XCTESTRUN"

            # Split this group's tests into two shards and run them on the two
            # simulators concurrently (issue #377). -retry-tests-on-failure with
            # -test-iterations 3 retries only the *failed test* in-process, so a
            # flaky test costs one rerun instead of re-running the whole group
            # (which the old shell-level retry did). This keeps the 3-attempt
            # retry budget while removing its compounding cost.
            COUNT=${#TESTS[@]}
            HALF=$(( (COUNT + 1) / 2 ))
            SHARD_A=("${TESTS[@]:0:HALF}")
            SHARD_B=("${TESTS[@]:HALF}")

            # One xcodebuild attempt against a single, already-booted simulator.
            #
            # -parallel-testing-enabled NO matters: the default test plan marks
            # the UI target parallelizable, so xcodebuild would CLONE its
            # destination simulator and run several at once. With two shards
            # already running that would put up to four simulators on a 3-vCPU /
            # 7 GB runner — memory pressure, launch timeouts, and a net loss.
            # Sharding is our parallelism; each shard gets exactly one device.
            #
            # Each shard also gets its own derived-data dir so the two
            # concurrent xcodebuild processes don't share scratch state. The
            # products themselves come from the (read-only) xctestrun.
            run_shard_once() {
              local sim_id="$1"; local result="$2"; local log="$3"; local ddp="$4"; shift 4
              local args=()
              local t
              for t in "$@"; do args+=("-only-testing:$t"); done
              rm -rf "$result"
              xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "id=$sim_id" \
                -resultBundlePath "$result" \
                -derivedDataPath "$ddp" \
                -parallel-testing-enabled NO \
                -retry-tests-on-failure \
                -test-iterations 3 \
                "${args[@]}" \
                > "$log" 2>&1
            }

            # In-process retry only covers *test* failures. It cannot recover
            # from the infrastructure flakes the old shell-level retry did —
            # simulator failing to boot, "Test runner never began executing",
            # install failures, xcodebuild dying. Those were the reason retries
            # existed, so keep a shard-level retry on top; it reruns half a
            # group at most, rather than the whole group as before.
            run_shard() {
              local attempt=1
              local max=2
              while :; do
                if run_shard_once "$@"; then return 0; fi
                if [ "$attempt" -ge "$max" ]; then return 1; fi
                echo "Shard attempt $attempt failed; retrying (infrastructure flake?)" >&2
                attempt=$(( attempt + 1 ))
              done
            }

            echo "Shard A (${#SHARD_A[@]} tests) on $SIM_A; Shard B (${#SHARD_B[@]} tests) on $SIM_B"

            RC_A=0
            RC_B=0
            run_shard "$SIM_A" TestResults-A.xcresult xcodebuild-A.log dd-A "${SHARD_A[@]}" &
            PID_A=$!
            if [ ${#SHARD_B[@]} -gt 0 ]; then
              run_shard "$SIM_B" TestResults-B.xcresult xcodebuild-B.log dd-B "${SHARD_B[@]}" &
              PID_B=$!
            else
              PID_B=""
            fi

            wait "$PID_A" || RC_A=$?
            if [ -n "$PID_B" ]; then wait "$PID_B" || RC_B=$?; fi

            # Output is only printed once both shards finish — interleaving two
            # live xcodebuild streams would be unreadable.
            for SHARD in A B; do
              LOG="xcodebuild-$SHARD.log"
              [ -f "$LOG" ] || continue
              echo "===== Shard $SHARD output ====="
              if command -v xcpretty >/dev/null 2>&1; then
                xcpretty < "$LOG" || true
              else
                cat "$LOG"
              fi
            done

            echo "Shard A rc=$RC_A, Shard B rc=$RC_B"
            [ "$RC_A" -eq 0 ] && [ "$RC_B" -eq 0 ]

      - name: Show failed tests
        if: failure()
        working-directory: "ios/Positive Only Social"
        run: |
          # Collect whichever shard logs exist: shard B does not run for a
          # single-entry group, and naming a missing file makes grep exit 2,
          # which would print "(none found)" right after real failures. The
          # array also keeps an unmatched glob from reaching grep as a literal
          # when a failure happens before any log is written.
          SHARD_LOGS=()
          for SHARD in A B; do
            [ -f "xcodebuild-$SHARD.log" ] && SHARD_LOGS+=("xcodebuild-$SHARD.log")
          done
          echo "=== Failed test cases (shard logs) ==="
          if [ ${#SHARD_LOGS[@]} -eq 0 ]; then
            echo "(no shard logs were produced — the run failed before testing started)"
          else
            grep -iE "test case .* failed|test suite .* failed" "${SHARD_LOGS[@]}" || echo "(no test-case lines found)"
          fi
          echo ""
          echo "=== Assertion failures (xcresult) ==="
          cat > /tmp/parse_xcresult.py << 'PYEOF'
          import json, sys

          def walk(node):
              if not isinstance(node, dict):
                  return
              if (node.get("_type", {}).get("_name") == "ActionTestSummary"
                      and node.get("testStatus", {}).get("_value") == "Failure"):
                  name = node.get("name", {}).get("_value", "(unknown)")
                  print("FAILED: " + name)
                  for s in node.get("failureSummaries", {}).get("_values", []):
                      msg = s.get("message", {}).get("_value", "")
                      loc = s.get("sourceCodeContext", {}).get("location", {})
                      f   = loc.get("file", {}).get("_value", "").split("/")[-1]
                      ln  = loc.get("line", {}).get("_value", "")
                      print("  -> " + msg)
                      if f:
                          print("     at " + f + ":" + ln)
              for v in node.values():
                  if isinstance(v, dict):
                      walk(v)
                  elif isinstance(v, list):
                      for item in v:
                          walk(item)

          try:
              walk(json.load(sys.stdin))
          except Exception as e:
              print("(xcresult parse error: " + str(e) + ")")
          PYEOF
          for BUNDLE in TestResults-A.xcresult TestResults-B.xcresult; do
            [ -d "$BUNDLE" ] || continue
            echo "--- $BUNDLE ---"
            xcrun xcresulttool get object --legacy --path "$BUNDLE" --format json \
              > /tmp/xcresult.json 2>/tmp/xcresult_err.txt || true
            if [ -s /tmp/xcresult.json ]; then
              python3 /tmp/parse_xcresult.py < /tmp/xcresult.json
            else
              echo "(xcresulttool produced no JSON — stderr below)"
              cat /tmp/xcresult_err.txt || true
            fi
          done
          echo ""
          echo "=== Compiler errors ==="
          if [ ${#SHARD_LOGS[@]} -eq 0 ]; then
            echo "(no shard logs)"
          else
            grep -E "error:" "${SHARD_LOGS[@]}" | grep -v "^▸" | head -50 || echo "(none)"
          fi
          for SHARD in A B; do
            LOG="xcodebuild-$SHARD.log"
            [ -f "$LOG" ] || continue
            echo ""
            echo "=== Last 500 lines of shard $SHARD log ==="
            tail -500 "$LOG"
          done

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.test-group }}
          path: |
            ios/Positive Only Social/xcodebuild-A.log
            ios/Positive Only Social/xcodebuild-B.log
            ios/Positive Only Social/TestResults-A.xcresult
            ios/Positive Only Social/TestResults-B.xcresult
